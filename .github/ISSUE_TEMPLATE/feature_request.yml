name: Feature request
description: Suggest a change to the public API or the documented workflow
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do with the current API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want, and whether it changes any existing result.
    validations:
      required: true
